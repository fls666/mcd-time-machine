name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Compile check
        run: python -m compileall -q mcd_timemachine

      - name: Run unittest
        run: python -m unittest discover -s tests -v

      - name: Smoke run (demo mode, no token required)
        run: |
          python -m mcd_timemachine demo --count 40 --out /tmp/mcdtm-ci
          test -f /tmp/mcdtm-ci/report.html
          test -f /tmp/mcdtm-ci/report.md
          test -f /tmp/mcdtm-ci/story.html
          test -f /tmp/mcdtm-ci/provenance.json

  # 故事页是纯前端产物，单元测试覆盖不到 DOM 行为。
  # 这里用 jsdom 真跑一遍页面脚本，验证动效降级、注入防护与分享卡片隐私默认值。
  story:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install jsdom
        run: npm install --no-save --no-audit --no-fund jsdom

      - name: Generate story pages (personal + public)
        run: |
          # --as-of 固定基准日期：否则示例数据随「今天」漂移，周次/时段/月度桶跟着变，
          # 版面几何断言会在个别日期莫名失败，产物也不再可复现。
          python -m mcd_timemachine demo --count 120 --out build --as-of 2026-06-30
          python -m mcd_timemachine story --out build --privacy public
          cp build/story.html build/public-story.html
          python -m mcd_timemachine story --out build --privacy personal

      - name: Story page smoke test
        env:
          # 装上 jsdom 就必须真跑，装不上直接让 job 失败，不允许静默跳过
          SMOKE_REQUIRE_JSDOM: "1"
        run: node scripts/smoke_story.js build/story.html build/public-story.html

  # jsdom 没有布局引擎与真实 Canvas 编码，测不到「手机宽度下的真实排版」与导出的 PNG。
  # 这里用 Playwright 补上手机宽度布局、长文本抗溢出、六章滚动与 PNG 尺寸，
  # 并且**跑两个引擎**：Chromium（375×812）与 WebKit（Safari 内核，390×844）。
  # 单引擎等于把 Safari 的字体回退与 Canvas 度量差异留在盲区里。
  browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Playwright + Chromium + WebKit
        run: |
          npm install --no-save --no-audit --no-fund playwright
          npx playwright install --with-deps chromium webkit

      - name: Generate story pages (personal + public)
        run: |
          python -m mcd_timemachine demo --count 120 --out build --as-of 2026-06-30
          python -m mcd_timemachine story --out build --privacy public
          cp build/story.html build/public-story.html
          python -m mcd_timemachine story --out build --privacy personal

      - name: Browser check · Chromium (375px viewport + PNG export)
        env:
          SMOKE_REQUIRE_PLAYWRIGHT: "1"
        run: |
          node scripts/browser_check.js build/story.html build/public-story.html \
            --engine=chromium --keep-png artifacts

      - name: Browser check · WebKit (Safari 内核，390px viewport)
        env:
          SMOKE_REQUIRE_PLAYWRIGHT: "1"
        run: |
          node scripts/browser_check.js build/story.html build/public-story.html \
            --engine=webkit --keep-png artifacts

      - name: Upload exported cards
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: share-card-png
          path: artifacts/**/*.png
          if-no-files-found: warn
